service: ms-recursos

# Se usa la v3 a proposito: la v4 exige una cuenta de serverless.com y un
# SERVERLESS_ACCESS_KEY para cada deploy. La v3 solo necesita credenciales
# de AWS, que es lo unico que da el Learner Lab.
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA_EVENTOS_PROCESADOS: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesados}
    DB_HOST: ${cf:infra-compartida-${sls:stage}.RdsEndpoint}
    DB_NAME: ppm_recursos
    DB_USER: ${ssm:/ppm/recursos/db-user}
    DB_PASSWORD: ${ssm:/ppm/recursos/db-password}
  # AWS Academy no permite crear roles IAM: se reusa LabRole.
  # En una cuenta propia, borra la linea `role:` y descomenta los permisos,
  # que son los minimos que este microservicio necesita.
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
    # role:
    #   statements:
  #     - Effect: Allow
  #       Action:
  #         - sns:Publish
  #       Resource: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:PutItem
  #       Resource: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesadosArn}
  #
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    # true, no "non-linux": en Linux "non-linux" NO usa Docker y busca un
    # binario python3.12 local, que no existe (el sistema trae 3.14).
    # Forzar Docker ademas garantiza que psycopg se compile contra Amazon
    # Linux, que es donde corre la Lambda.
    dockerizePip: true
    slim: true
    # Cache propio por repo. El cache global de ~/.cache lo comparten todos
    # los servicios, y si dos despliegues corren a la vez un contenedor lo
    # deja en root:root mientras el otro lo lee -> EACCES.
    cacheLocation: ./.serverless-cache
  autorizador:
    # El authorizer vive en infra-compartida y lo comparten los 6 microservicios
    name: autorizadorCompartido
    type: request
    arn: ${cf:infra-compartida-${sls:stage}.AutorizadorArn}
    resultTtlInSeconds: 300
    identitySource: method.request.header.Authorization

functions:

  health:
    handler: src/handlers/health.manejar
    events:
      - http: { path: "/health", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  listarRecursos:
    handler: src/handlers/recursos.listar
    description: Personas con su ocupacion · ?rol= ?sobreasignados=true ?disponibles=true
    events:
      - http: { path: "/recursos", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  obtenerRecurso:
    handler: src/handlers/recursos.obtener
    events:
      - http: { path: "/recursos/{id}", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  crearRecurso:
    handler: src/handlers/recursos.crear
    events:
      - http: { path: "/recursos", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  actualizarRecurso:
    handler: src/handlers/recursos.actualizar
    events:
      - http: { path: "/recursos/{id}", method: put, cors: true, authorizer: "${self:custom.autorizador}" }

  carga:
    handler: src/handlers/recursos.carga
    description: La vista de Workload con el resumen del equipo
    events:
      - http: { path: "/carga", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  listarAsignaciones:
    handler: src/handlers/asignaciones.listar
    events:
      - http: { path: "/asignaciones", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  crearAsignacion:
    handler: src/handlers/asignaciones.crear
    description: Publica recurso.asignado y, al cruzar el 100%, recurso.sobreasignado
    events:
      - http: { path: "/asignaciones", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  liberarAsignacion:
    handler: src/handlers/asignaciones.liberar
    events:
      - http: { path: "/asignaciones/{id}", method: delete, cors: true, authorizer: "${self:custom.autorizador}" }

resources:
  Resources:

    # ---------- CORS en las respuestas de ERROR ----------
    # API Gateway genera los 401/403 ANTES de llegar a la Lambda, y esas
    # respuestas no llevan cabeceras CORS. Desde el navegador un 401 se ve
    # entonces como un error de CORS, no como un 401: el frontend no puede
    # distinguir "tu sesion vencio" de "el servidor no responde".
    Cors401:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: UNAUTHORIZED
        StatusCode: "401"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors403:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: ACCESS_DENIED
        StatusCode: "403"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors4xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors5xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
