service: ms-recursos

frameworkVersion: "3"

provider:
  name: aws
  apiGateway:
    restApiId: ${cf:infra-compartida-${sls:stage}.ApiId}
    restApiRootResourceId: ${cf:infra-compartida-${sls:stage}.ApiRootResourceId}
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA_EVENTOS_PROCESADOS: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesados}
    DB_HOST: ${cf:infra-compartida-${sls:stage}.RdsEndpoint}
    DB_NAME: ppm_recursos
    DB_SECRETO: ppm/recursos/db
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"
    - "seed/esquema.sql"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    slim: true
    cacheLocation: ./.serverless-cache
  autorizador:
    type: CUSTOM
    authorizerId: ${cf:infra-compartida-${sls:stage}.AutorizadorApiId}

functions:

  health:
    handler: src/handlers/health.manejar
    events:
      - http: { path: "/recursos/health", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  listarRecursos:
    handler: src/handlers/recursos.listar
    description: Personas con su ocupacion · ?rol= ?sobreasignados=true ?disponibles=true
    events:
      - http: { path: "/recursos/recursos", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  obtenerRecurso:
    handler: src/handlers/recursos.obtener
    events:
      - http: { path: "/recursos/recursos/{id}", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  crearRecurso:
    handler: src/handlers/recursos.crear
    events:
      - http: { path: "/recursos/recursos", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  actualizarRecurso:
    handler: src/handlers/recursos.actualizar
    events:
      - http: { path: "/recursos/recursos/{id}", method: put, cors: true, authorizer: "${self:custom.autorizador}" }

  carga:
    handler: src/handlers/recursos.carga
    description: La vista de Workload con el resumen del equipo
    events:
      - http: { path: "/recursos/carga", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  listarAsignaciones:
    handler: src/handlers/asignaciones.listar
    events:
      - http: { path: "/recursos/asignaciones", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  crearAsignacion:
    handler: src/handlers/asignaciones.crear
    description: Publica recurso.asignado y, al cruzar el 100%, recurso.sobreasignado
    events:
      - http: { path: "/recursos/asignaciones", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  liberarAsignacion:
    handler: src/handlers/asignaciones.liberar
    events:
      - http: { path: "/recursos/asignaciones/{id}", method: delete, cors: true, authorizer: "${self:custom.autorizador}" }

  aprovisionarTenant:
    handler: src/handlers/aprovisionar.aprovisionar
    name: ms-recursos-${sls:stage}-aprovisionarTenant
    description: Crea el schema del tenant y aplica el DDL de este servicio
    timeout: 60

  compensarTenant:
    handler: src/handlers/aprovisionar.compensar
    name: ms-recursos-${sls:stage}-compensarTenant
    description: "Rollback del alta: elimina el schema del tenant"
    timeout: 30

resources:
  Resources:

